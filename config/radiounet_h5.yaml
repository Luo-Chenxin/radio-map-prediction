seed: 42

load:
  train_ratio: 0.8
  val_ratio: 0.1
  train_batch_size: 16
  val_batch_size: 16
  test_batch_size: 16
  num_workers: 0

train:
  epoch: 20
  learning_rate: 1e-4
  scheduler:
    step_size: 15
    gamma: 0.1
  early_stop:
    patience: 20
    delta: 0.0
  out_dir: "outputs"

data:
  type: 'h5'                                     # Distinguish from other datasets
  h5_path: "data/block.h5"   # Dataset File Path
  threshold: 0                                 # RSS threshold; the range is [0, 1)
